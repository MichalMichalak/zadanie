plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.spring)
    alias(libs.plugins.spring.boot)
    id 'application'
}

group = 'coupons.exercise'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(libs.spring.boot.dependencies)
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.jdbc
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.data.redis
    implementation libs.spring.boot.starter.restclient
    implementation libs.spring.boot.starter.actuator
    implementation libs.micrometer.registry.prometheus
    runtimeOnly libs.mysql.connector.j
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.testcontainers.mysql
}

tasks.named('test') {
    useJUnitPlatform {
        // The stress test opens ~100 concurrent connections; it is opt-in, see stressTest below.
        excludeTags 'stress'
    }
}

// Opt-in: many concurrent connections through the real server, slower and noisier than the
// default suite. Run before releases, in a nightly job, or when touching redemption/SQL/pool code.
tasks.register('stressTest', Test) {
    description = 'Runs the stress-tagged tests, which open many concurrent connections.'
    group = 'verification'
    dependsOn 'testClasses'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'stress'
    }
    shouldRunAfter tasks.named('test')
}

// The tests apply the same DDL as dev-env/init-db.sh, so the schema has a single source.
tasks.named('processTestResources') {
    from('../dev-env/schema.sql')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'local.exercise.coupons.ApplicationKt'
}
